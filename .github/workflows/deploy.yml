name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 21 * * *' # 06:23 JST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate project metadata
        run: npm run check:content

      - name: Build Astro site from public GitHub repositories
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated pages
        run: npm run check:content -- --built

      # Changing a legacy Pages source requires repository settings access.
      # GITHUB_TOKEN can read the source but cannot change it.
      - name: Check GitHub Pages source
        uses: actions/github-script@v7
        with:
          script: |
            const { data: site } = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
            core.info('Pages build type: ' + site.build_type);
            if (site.build_type !== 'workflow') {
              core.warning('Set Settings > Pages > Build and deployment > Source to GitHub Actions. Legacy Jekyll builds fail on Astro sources; this workflow builds and deploys dist/.');
            }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

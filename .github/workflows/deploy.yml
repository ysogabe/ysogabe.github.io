name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 21 * * *' # 06:23 JST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate project metadata
        run: npm run check:content

      - name: Build Astro site from public GitHub repositories
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated pages
        run: npm run check:content -- --built

      # Astro source files cannot be built by the legacy Jekyll pipeline.
      # Use only the existing, repository-scoped GITHUB_TOKEN; never a PAT.
      - name: Use GitHub Actions as the Pages source
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const { data: site } = await github.request('GET /repos/{owner}/{repo}/pages', repo);
            core.info('Pages build type: ' + site.build_type);
            if (site.build_type !== 'workflow') {
              await github.request('PUT /repos/{owner}/{repo}/pages', {
                ...repo,
                build_type: 'workflow'
              });
            }
            const { data: configured } = await github.request('GET /repos/{owner}/{repo}/pages', repo);
            if (configured.build_type !== 'workflow') {
              core.setFailed('Pages source must be GitHub Actions (workflow).');
            }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
